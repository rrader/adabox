<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b7b"/>
      <stop offset="55%" stop-color="#e0457a"/>
      <stop offset="100%" stop-color="#6c42bd"/>
    </linearGradient>

    <!-- Glass Top Sheen -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Metallic Gold for SD Pins -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Outer Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#e0457a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Main Rounded Rectangle Badge -->
  <rect x="2" y="2" width="36" height="36" rx="9" fill="url(#bgGrad)" filter="url(#badgeShadow)"/>
  <rect x="2" y="2" width="36" height="36" rx="9" fill="url(#glassSheen)"/>

  <!-- Jukebox Arch Silhouette -->
  <path d="M 10 28 V 16 A 10 10 0 0 1 30 16 V 28" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.95" filter="url(#neonGlow)"/>
  
  <!-- Jukebox Outer Frame Base -->
  <path d="M 8 28.5 H 32" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Vinyl Disc inside Jukebox Arch -->
  <circle cx="20" cy="17.5" r="6" fill="#12121e" stroke="#ffffff" stroke-width="1.2" opacity="0.9"/>
  <circle cx="20" cy="17.5" r="4.2" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.3"/>
  <circle cx="20" cy="17.5" r="2.2" fill="url(#bgGrad)"/>
  <circle cx="20" cy="17.5" r="0.8" fill="#ffffff"/>

  <!-- Floating Music Note Top-Left -->
  <path d="M 9.5 13 V 10 L 13.5 9 V 12 M 9.5 11.2 L 13.5 10.2" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="8.5" cy="13" r="1.2" fill="#00f2fe"/>
  <circle cx="12.5" cy="12" r="1.2" fill="#00f2fe"/>

  <!-- SD Card Badge Overlay (Bottom Right) -->
  <path d="M 23 23 H 30 A 1.5 1.5 0 0 1 31.5 24.5 V 31 A 1.5 1.5 0 0 1 30 32.5 H 22.5 A 1.5 1.5 0 0 1 21 31 V 25 Z" fill="#181828" stroke="#ffffff" stroke-width="1.2"/>
  
  <!-- Gold Pins on SD Card -->
  <line x1="23.2" y1="25" x2="23.2" y2="27" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round"/>
  <line x1="25.2" y1="25" x2="25.2" y2="27" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round"/>
  <line x1="27.2" y1="25" x2="27.2" y2="27" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round"/>
  <line x1="29.2" y1="25" x2="29.2" y2="27" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round"/>

  <!-- Micro SD label line -->
  <path d="M 23.5 29.5 H 29" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
</svg>
